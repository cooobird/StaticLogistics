plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // validateAccessTransformers = true

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
        }

        server {
            server()
//            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments.addAll([
                    // 忽略无效指令，避免有的人没安装 JetBrain Runtime 无法启动游戏
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    // 启用 JetBrain Runtime 热重载功能
                    "-XX:+AllowEnhancedClassRedefinition",
                    // 并发修改检测
                    //"-javaagent:mods/CMESuckMyDuck-1.0.5.jar=net/minecraft/util/ClassInstanceMultiMap;byClass;Map;nonstatic"
            ])
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven { // Registrate
        url "https://maven.gegy.dev/releases"
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
}

dependencies {
    modImplementation("blank:MesdagPortLib-${portlib_version}:universal")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"

    modCompileOnly "curse.maven:jade-324717:6855440"
    modRuntimeOnly "curse.maven:jade-324717:6855440"

    modCompileOnly "mekanism:Mekanism:${mekanism_version}:api"
    modCompileOnly "mekanism:Mekanism:${mekanism_version}"
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}"
    modCompileOnly "mekanism:Mekanism:${mekanism_version}:additions"
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}:additions"
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}:generators"
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}:tools"

    modRuntimeOnly "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    modRuntimeOnly "com.eliotlash.mclib:mclib:20"
    modCompileOnly "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"
    modRuntimeOnly "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"

    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    modRuntimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    modCompileOnly "vazkii.botania:Botania:${botania_version}:api"
    modCompileOnly "vazkii.botania:Botania:${botania_version}"
    modRuntimeOnly "vazkii.botania:Botania:${botania_version}"

    modImplementation "dev.architectury:architectury-forge:${architectury_version}"
    modCompileOnly "dev.ftb.mods:ftb-library-forge:${ftb_library_version}"
    modRuntimeOnly "dev.ftb.mods:ftb-library-forge:${ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}"
    modRuntimeOnly "dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}"

    modCompileOnly "curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_version}"
    modRuntimeOnly "curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_version}"

    modCompileOnly "com.tterrag.registrate:Registrate:MC1.20-1.3.11"
    modCompileOnly "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}"
    modRuntimeOnly "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}"
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xlint:-removal']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}